<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match the Mugshots - Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            letter-spacing: 1px;
        }

        .scanner-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .scanner-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }

        .scanner-section {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 20px;
            border: 2px solid #444;
        }

        .scanner-section h2 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .scanner-section.crime h2 {
            color: #ff6b6b;
        }

        .scanner-section.mugshot h2 {
            color: #4dabf7;
        }

        video {
            width: 100%;
            border-radius: 8px;
            background: #000;
            display: block;
            margin-bottom: 15px;
        }

        .result-box {
            background: #1a1a1a;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result-box.empty {
            color: #666;
        }

        .result-box.scanned {
            color: #4dabf7;
            border-color: #4dabf7;
        }

        .result-box.crime.scanned {
            color: #ff6b6b;
            border-color: #ff6b6b;
        }

        .verdict-section {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 20px;
            border: 3px solid #444;
        }

        .verdict-section.match {
            background: rgba(76, 175, 80, 0.15);
            border-color: #4caf50;
        }

        .verdict-section.no-match {
            background: rgba(244, 67, 54, 0.15);
            border-color: #f44336;
        }

        .verdict-text {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .verdict-section.match .verdict-text {
            color: #4caf50;
        }

        .verdict-section.no-match .verdict-text {
            color: #f44336;
        }

        .verdict-subtitle {
            font-size: 16px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            background: #333;
            color: white;
            border: 2px solid #555;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        button:hover {
            background: #444;
            border-color: #666;
        }

        button.reset {
            background: #2a2a2a;
        }

        button.reset:hover {
            background: #333;
        }

        .info {
            background: #2a2a2a;
            border-left: 4px solid #4dabf7;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.6;
        }

        .info strong {
            color: #4dabf7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 MATCH THE MUGSHOTS</h1>

        <div class="info">
            <strong>How to use:</strong> Scan the crime card QR code on the left, then scan the mugshot card QR code on the right. The app will instantly show if they match!
        </div>

        <div class="verdict-section" id="verdict" style="display: none;">
            <div class="verdict-text" id="verdictText"></div>
            <div class="verdict-subtitle" id="verdictSubtitle"></div>
        </div>

        <div class="scanner-grid">
            <div class="scanner-section crime">
                <h2>📋 Crime Card</h2>
                <video id="videoCrime" autoplay playsinline></video>
                <div class="result-box empty" id="crimeResult">Scan crime QR</div>
            </div>

            <div class="scanner-section mugshot">
                <h2>📸 Mugshot Card</h2>
                <video id="videoMugshot" autoplay playsinline></video>
                <div class="result-box empty" id="mugshotResult">Scan mugshot QR</div>
            </div>
        </div>

        <div class="controls">
            <button class="reset" onclick="resetScan()">↻ RESET</button>
        </div>
    </div>

    <script>
        let crimeScan = null;
        let mugshotScan = null;

        async function startScanner(videoElementId, resultElementId, callback) {
            const video = document.getElementById(videoElementId);
            const resultBox = document.getElementById(resultElementId);
            const canvas = document.createElement('canvas');
            const canvasContext = canvas.getContext('2d');

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                video.srcObject = stream;

                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;

                    function scanFrame() {
                        canvasContext.drawImage(video, 0, 0, canvas.width, canvas.height);
                        const imageData = canvasContext.getImageData(0, 0, canvas.width, canvas.height);
                        const code = jsQR(imageData.data, imageData.width, imageData.height);

                        if (code && !callback.scanned) {
                            const value = code.data;
                            callback.scanned = true;
                            callback.value = value;
                            resultBox.textContent = `Card: ${value}`;
                            resultBox.classList.remove('empty');
                            resultBox.classList.add('scanned');
                            checkMatch();
                            stream.getTracks().forEach(track => track.stop());
                            return;
                        }

                        if (!callback.scanned) {
                            requestAnimationFrame(scanFrame);
                        }
                    }

                    scanFrame();
                };
            } catch (err) {
                console.error('Camera access error:', err);
                resultBox.textContent = '❌ Camera access denied';
                resultBox.style.color = '#f44336';
            }
        }

        function checkMatch() {
            if (!crimeScan || !crimeScan.scanned || !mugshotScan || !mugshotScan.scanned) {
                return;
            }

            const verdict = document.getElementById('verdict');
            const verdictText = document.getElementById('verdictText');
            const verdictSubtitle = document.getElementById('verdictSubtitle');

            const match = crimeScan.value === mugshotScan.value;

            if (match) {
                verdict.classList.remove('no-match');
                verdict.classList.add('match');
                verdictText.textContent = '✅ MATCH!';
                verdictSubtitle.textContent = `Card ${crimeScan.value} - +1 Point!`;
            } else {
                verdict.classList.remove('match');
                verdict.classList.add('no-match');
                verdictText.textContent = '❌ NO MATCH';
                verdictSubtitle.textContent = `Crime ${crimeScan.value} ≠ Mugshot ${mugshotScan.value}`;
            }

            verdict.style.display = 'block';
        }

        function resetScan() {
            crimeScan = { scanned: false, value: null };
            mugshotScan = { scanned: false, value: null };

            document.getElementById('crimeResult').textContent = 'Scan crime QR';
            document.getElementById('crimeResult').classList.remove('scanned');
            document.getElementById('crimeResult').classList.add('empty');

            document.getElementById('mugshotResult').textContent = 'Scan mugshot QR';
            document.getElementById('mugshotResult').classList.remove('scanned');
            document.getElementById('mugshotResult').classList.add('empty');

            document.getElementById('verdict').style.display = 'none';

            startScanner('videoCrime', 'crimeResult', crimeScan);
            startScanner('videoMugshot', 'mugshotResult', mugshotScan);
        }

        // Initialize
        crimeScan = { scanned: false, value: null };
        mugshotScan = { scanned: false, value: null };

        startScanner('videoCrime', 'crimeResult', crimeScan);
        startScanner('videoMugshot', 'mugshotResult', mugshotScan);
    </script>
</body>
</html>
